name: Checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate data files
        run: for f in site/data/*.json; do python3 -c "import json,sys; json.load(open(sys.argv[1]))" "$f"; done
      - name: Site script is built from its modules
        run: python3 tools/build_js.py --check
      - name: Check site script syntax
        run: node -e "new Function(require('fs').readFileSync('site/assets/js/app.js','utf8'))"
      - name: Handbook index is generated from docs/guides
        run: python3 tools/guides_index.py --check
      - name: Contract specs are generated from the data
        run: python3 tools/contracts_md.py --check
      - name: CSS fallbacks for older browsers
        run: python3 tools/css_compat.py --check
      - name: Internal links resolve
        run: python3 tools/check_links.py
      - name: Roadmap updated with every release (HP-SOP-003)
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.base_ref }}
        run: |
          git fetch -q --depth=50 origin "$BASE"
          if git diff "origin/$BASE" -- site/data/config.json | grep -q '^[-+].*"version"'; then
            if git diff --quiet "origin/$BASE" -- ROADMAP.md; then echo "The version changed but ROADMAP.md was not updated (HP-SOP-003)."; exit 1; fi
          fi
          echo "Roadmap check passed."
      - name: Infraction record is valid
        run: python3 tools/infractions.py verify
      - name: AI agent detection
        run: |
          printf 'Fix\n\nCo-Authored-By: Claude <noreply@anthropic.com>\n' | python3 tools/agents.py --stdin | grep -qx Claude
          printf 'Fix\n\nSigned-off-by: Someone <a@b.c>\n' | python3 tools/agents.py --stdin | grep -qx 'No AI agent detected'
      - name: Check relative links in docs
        run: python3 tools/check_links.py
      - name: Docs library entries exist
        run: python3 -c "import json,os,sys; m=[d['path'] for d in json.load(open('site/data/docs.json'))['docs'] if not os.path.exists(d['path'])]; print('missing:',m); sys.exit(1 if m else 0)"
      - name: No game files committed
        run: |
          if git ls-files | grep -iE '\.(exe|dll|dat|fpk|fpkd|pak|arc)$'; then echo "Game or binary files found"; exit 1; fi
      - name: Contributor records verify
        run: |
          pip install --quiet cryptography
          python3 tools/records.py verify
      - name: Build single-file site
        run: python3 tools/bundle_site.py _bundle.html

  browsers:
    name: Browsers (Chromium, Firefox, WebKit)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install Playwright and browsers
        run: |
          pip install playwright fonttools brotli
          # The browser download sometimes stalls; give each try 6 minutes and retry
          for i in 1 2 3; do timeout 360 python -m playwright install --with-deps chromium firefox webkit && break; echo "Retry $i"; done
      - name: Assemble site
        run: python3 tools/assemble_site.py _site --woff2
      - name: Smoke test in all engines
        run: python3 tests/browser_smoke.py _site chromium firefox webkit
