name: Deploy site

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "tools/**"
      - "docs/**"
      - "research/**"
      - "README.md"
      - "ROADMAP.md"
      - "CONTRIBUTING.md"
      - "CODE_OF_CONDUCT.md"
      - "SECURITY.md"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Assemble site
        run: |
          pip install fonttools brotli
          python3 tools/assemble_site.py _site --woff2
          for f in _site/data/*.json; do python3 -c "import json,sys; json.load(open(sys.argv[1]))" "$f"; done
      - name: Handbook PDFs
        # Chromium comes ready-made in Playwright's image (as in the checks), so a deploy never waits on the Ubuntu package mirror
        timeout-minutes: 15
        run: |
          docker run --rm -v "$PWD:/w" -w /w mcr.microsoft.com/playwright/python:v1.52.0-noble \
            bash -c 'python3 -c "import playwright" 2>/dev/null || pip install -q --break-system-packages playwright==1.52.0; python3 tools/guides_pdf.py _site'
          sudo chown -R "$(id -u):$(id -g)" _site
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
