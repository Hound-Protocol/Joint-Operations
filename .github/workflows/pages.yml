name: Redirect old site address

# The website moved to Hound-Protocol/joint-operations-web.
# This keeps the old address (hound-protocol.github.io/Joint-Operations/) working:
# every page forwards to the same page on the new site, keeping its #/ route.
# Run it by hand (Actions -> Redirect old site address -> Run workflow) once the new site is live.
# Until then the last deploy of the old site stays up.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Write redirect pages
        run: |
          mkdir -p _site
          cat > _site/index.html <<'HTML'
          <!doctype html>
          <html lang="en"><head><meta charset="utf-8">
          <title>Joint Operations has moved</title>
          <meta name="robots" content="noindex">
          <link rel="canonical" href="https://hound-protocol.github.io/joint-operations-web/">
          <meta http-equiv="refresh" content="0; url=https://hound-protocol.github.io/joint-operations-web/">
          <script>
            var p = location.pathname.replace(/^\/Joint-Operations\/?/i, "");
            location.replace("https://hound-protocol.github.io/joint-operations-web/" + p + location.search + location.hash);
          </script>
          <style>body{background:#0b0d0e;color:#c9d1d6;font:16px system-ui,sans-serif;display:grid;place-items:center;min-height:100vh;margin:0}a{color:#e8a33d}</style>
          </head><body><p>The Joint Operations website has moved to <a href="https://hound-protocol.github.io/joint-operations-web/">hound-protocol.github.io/joint-operations-web</a>.</p></body></html>
          HTML
          cp _site/index.html _site/404.html
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
