name: Release

# Publishes a GitHub release when the version in site/data/config.json changes on main.
# Notes come from CHANGELOG.md. See docs/guides/HP-SOP-003-release.md.
on:
  push:
    branches: [main]
    paths:
      - "site/data/config.json"
      - "CHANGELOG.md"
      - ".github/workflows/release.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Read version and notes
        id: v
        run: |
          out=$(python3 tools/release_notes.py notes.md)
          echo "tag=$(echo "$out" | sed -n 1p)" >> "$GITHUB_OUTPUT"
          echo "title=$(echo "$out" | sed -n 2p)" >> "$GITHUB_OUTPUT"
          echo "channel=$(echo "$out" | sed -n 3p)" >> "$GITHUB_OUTPUT"
      - name: Publish if this version has no release yet
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.v.outputs.tag }}
          TITLE: ${{ steps.v.outputs.title }}
          CHANNEL: ${{ steps.v.outputs.channel }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists. Nothing to do."
            exit 0
          fi
          flag=""
          [ "$CHANNEL" = "prerelease" ] && flag="--prerelease"
          gh release create "$TAG" --target "$GITHUB_SHA" --title "$TITLE" --notes-file notes.md $flag
          echo "Published $TAG"
